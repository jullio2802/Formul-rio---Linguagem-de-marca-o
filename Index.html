<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Rock in Rio</title>
    <link rel="stylesheet" href="CSS.CSS">
</head>
<body>
    <div class="container">
        <h1> CADASTRO ROCK IN RIO</h1>
        <br>

        <form>

        <div class="form-control">
            <label for="nome"> Nome: </label>
            <input type="text" id="nome"/>
        </div>

         <div class="form-control">
            <label for="email"> E-mail: </label>
            <input type="email" id="email"/>
        </div>

         <div class="form-control">
            <label for="telefone"> Telefone: </label>
            <input type="tel" id="telefone"/>
        </div>

        <div class ="form-control">
            <label for="chave">ID chave:</label>
            <input type="password" id="chave"/>
        </div>

        <div class="form-control">
            <label for="data" > Data de incrição </label>
            <input type="date" id="data"/>
        </div>

        <div class="form-control">
            <label for="pagamento">Método de pagamento:</label>

            <select name="pagamento" id="pagamento">
                <option value=""> Selecione</option>
                <option value="informatica"> Cartão de Crédito</option>
                <option value="web"> Cartão de débito</option>
                <option value="prog"> Pix</option>
                <option value="prog"> Boleto</option>
                <option value="prog"> Troca solidária</option>
            </select>
        </div>

        <div class="form-control">
            <button type="submit"> Cadastrar </button>
            <button type="reset"> Limpar</button>
        </div>

        </form>
    </div>
</body>
</html>
